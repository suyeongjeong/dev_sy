<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대량 문자발송 애플리케이션 - 데모</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            background: #4caf50;
            color: white;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            background: white;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .tab:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-danger {
            background: #f44336;
            color: white;
            padding: 8px 16px;
            font-size: 14px;
        }

        .contact-list {
            margin-top: 20px;
        }

        .contact-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .contact-phone {
            color: #666;
            font-size: 14px;
        }

        .contact-actions {
            display: flex;
            gap: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .message-info {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        .selected-contacts {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .history-item {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .history-date {
            color: #666;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-success {
            background: #4caf50;
            color: white;
        }

        .history-message {
            margin: 10px 0;
        }

        .history-stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #666;
        }

        .checkbox-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .checkbox-item:hover {
            background: #e8e8e8;
        }

        .checkbox-item.selected {
            background: #e3f2fd;
            border-color: #667eea;
        }

        .select-all-btn {
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 대량 문자발송 애플리케이션</h1>
            <p>AWS SNS 기반 크로스플랫폼 SMS 발송 서비스 데모</p>
            <span class="status" id="serverStatus">⚡ 서버 연결 확인 중...</span>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('contacts')">📇 연락처 관리</button>
            <button class="tab" onclick="switchTab('send')">✉️ 문자 발송</button>
            <button class="tab" onclick="switchTab('history')">📊 발송 이력</button>
        </div>

        <div class="content">
            <!-- 연락처 관리 탭 -->
            <div id="contacts" class="tab-content active">
                <h2>연락처 관리</h2>
                <div class="form-group">
                    <label>이름</label>
                    <input type="text" id="contactName" placeholder="홍길동">
                </div>
                <div class="form-group">
                    <label>전화번호</label>
                    <input type="tel" id="contactPhone" placeholder="01012345678">
                </div>
                <div class="form-group">
                    <label>이메일 (선택)</label>
                    <input type="email" id="contactEmail" placeholder="hong@example.com">
                </div>
                <div class="form-group">
                    <label>그룹 (선택)</label>
                    <input type="text" id="contactGroup" placeholder="고객">
                </div>
                <button class="btn btn-primary" onclick="addContact()">연락처 추가</button>

                <div class="contact-list" id="contactList">
                    <p class="loading">연락처를 불러오는 중...</p>
                </div>
            </div>

            <!-- 문자 발송 탭 -->
            <div id="send" class="tab-content">
                <h2>대량 문자 발송</h2>

                <div class="form-group">
                    <label>메시지 작성</label>
                    <textarea id="messageText" placeholder="발송할 메시지를 입력하세요" oninput="updateMessageInfo()"></textarea>
                    <div class="message-info">
                        <span id="messageLength">0</span>자 / <span id="smsCount">0</span>건
                    </div>
                </div>

                <div class="selected-contacts" id="selectedInfo">
                    선택된 연락처: <strong id="selectedCount">0</strong>명
                </div>

                <button class="btn btn-success select-all-btn" onclick="selectAllContacts()">전체 선택</button>
                <button class="btn btn-danger select-all-btn" onclick="deselectAllContacts()">선택 해제</button>

                <div id="sendContactList"></div>

                <button class="btn btn-primary" onclick="sendBulkSMS()" style="margin-top: 20px; width: 100%;">
                    문자 발송하기
                </button>
            </div>

            <!-- 발송 이력 탭 -->
            <div id="history" class="tab-content">
                <h2>발송 이력</h2>
                <button class="btn btn-primary" onclick="loadHistory()" style="margin-bottom: 20px;">새로고침</button>
                <div id="historyList">
                    <p class="loading">발송 이력을 불러오는 중...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        const USER_ID = 'demo_user_001';
        let contacts = [];
        let selectedContactIds = new Set();

        // 서버 상태 확인
        async function checkServerStatus() {
            try {
                const response = await fetch('http://localhost:3000/health');
                const data = await response.json();
                if (data.status === 'OK') {
                    document.getElementById('serverStatus').innerHTML = '✅ 서버 연결됨';
                    document.getElementById('serverStatus').style.background = '#4caf50';
                }
            } catch (error) {
                document.getElementById('serverStatus').innerHTML = '❌ 서버 연결 실패';
                document.getElementById('serverStatus').style.background = '#f44336';
            }
        }

        // 탭 전환
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');

            if (tabName === 'contacts') loadContacts();
            if (tabName === 'send') loadContactsForSend();
            if (tabName === 'history') loadHistory();
        }

        // 연락처 불러오기
        async function loadContacts() {
            try {
                const response = await fetch(`${API_URL}/contacts?userId=${USER_ID}`);
                const data = await response.json();
                contacts = data.data;
                renderContacts();
            } catch (error) {
                document.getElementById('contactList').innerHTML =
                    '<p class="empty-state">연락처를 불러오는데 실패했습니다.</p>';
            }
        }

        // 연락처 렌더링
        function renderContacts() {
            const list = document.getElementById('contactList');
            if (contacts.length === 0) {
                list.innerHTML = '<p class="empty-state">등록된 연락처가 없습니다.</p>';
                return;
            }

            list.innerHTML = contacts.map(contact => `
                <div class="contact-item">
                    <div class="contact-info">
                        <div class="contact-name">${contact.name}</div>
                        <div class="contact-phone">${contact.phoneNumber}</div>
                        ${contact.email ? `<div class="contact-phone">${contact.email}</div>` : ''}
                        ${contact.group ? `<div class="contact-phone">그룹: ${contact.group}</div>` : ''}
                    </div>
                    <div class="contact-actions">
                        <button class="btn btn-danger" onclick="deleteContact('${contact.id}')">삭제</button>
                    </div>
                </div>
            `).join('');
        }

        // 연락처 추가
        async function addContact() {
            const name = document.getElementById('contactName').value;
            const phone = document.getElementById('contactPhone').value;
            const email = document.getElementById('contactEmail').value;
            const group = document.getElementById('contactGroup').value;

            if (!name || !phone) {
                alert('이름과 전화번호를 입력해주세요.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/contacts`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, phoneNumber: phone, email, group, userId: USER_ID})
                });

                if (response.ok) {
                    alert('연락처가 추가되었습니다.');
                    document.getElementById('contactName').value = '';
                    document.getElementById('contactPhone').value = '';
                    document.getElementById('contactEmail').value = '';
                    document.getElementById('contactGroup').value = '';
                    loadContacts();
                }
            } catch (error) {
                alert('연락처 추가에 실패했습니다.');
            }
        }

        // 연락처 삭제
        async function deleteContact(id) {
            if (!confirm('이 연락처를 삭제하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/contacts/${id}`, {method: 'DELETE'});
                if (response.ok) {
                    alert('연락처가 삭제되었습니다.');
                    loadContacts();
                }
            } catch (error) {
                alert('연락처 삭제에 실패했습니다.');
            }
        }

        // 발송용 연락처 불러오기
        async function loadContactsForSend() {
            await loadContacts();
            const list = document.getElementById('sendContactList');

            if (contacts.length === 0) {
                list.innerHTML = '<p class="empty-state">등록된 연락처가 없습니다.</p>';
                return;
            }

            list.innerHTML = contacts.map(contact => `
                <div class="checkbox-item ${selectedContactIds.has(contact.id) ? 'selected' : ''}"
                     onclick="toggleContact('${contact.id}')">
                    <div class="contact-name">${contact.name}</div>
                    <div class="contact-phone">${contact.phoneNumber}</div>
                </div>
            `).join('');
            updateSelectedCount();
        }

        // 연락처 선택 토글
        function toggleContact(id) {
            if (selectedContactIds.has(id)) {
                selectedContactIds.delete(id);
            } else {
                selectedContactIds.add(id);
            }
            loadContactsForSend();
        }

        // 전체 선택
        function selectAllContacts() {
            selectedContactIds = new Set(contacts.map(c => c.id));
            loadContactsForSend();
        }

        // 선택 해제
        function deselectAllContacts() {
            selectedContactIds.clear();
            loadContactsForSend();
        }

        // 선택된 연락처 수 업데이트
        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = selectedContactIds.size;
        }

        // 메시지 정보 업데이트
        function updateMessageInfo() {
            const text = document.getElementById('messageText').value;
            const length = text.length;
            const smsCount = Math.ceil(length / 70) || 0;

            document.getElementById('messageLength').textContent = length;
            document.getElementById('smsCount').textContent = smsCount;
        }

        // 대량 SMS 발송
        async function sendBulkSMS() {
            const message = document.getElementById('messageText').value;

            if (!message) {
                alert('메시지를 입력해주세요.');
                return;
            }

            if (selectedContactIds.size === 0) {
                alert('발송할 연락처를 선택해주세요.');
                return;
            }

            if (!confirm(`${selectedContactIds.size}명에게 문자를 발송하시겠습니까?`)) return;

            const phoneNumbers = contacts
                .filter(c => selectedContactIds.has(c.id))
                .map(c => c.phoneNumber);

            try {
                const response = await fetch(`${API_URL}/sms/send`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phoneNumbers, message, userId: USER_ID})
                });

                const data = await response.json();
                if (data.success) {
                    alert(`발송 완료!\n성공: ${data.data.totalSent}건\n실패: ${data.data.totalFailed}건`);
                    document.getElementById('messageText').value = '';
                    deselectAllContacts();
                }
            } catch (error) {
                alert('문자 발송에 실패했습니다.');
            }
        }

        // 발송 이력 불러오기
        async function loadHistory() {
            try {
                const response = await fetch(`${API_URL}/history?userId=${USER_ID}`);
                const data = await response.json();
                const history = data.data;

                const list = document.getElementById('historyList');
                if (history.length === 0) {
                    list.innerHTML = '<p class="empty-state">발송 이력이 없습니다.</p>';
                    return;
                }

                list.innerHTML = history.map(item => {
                    const successRate = ((item.totalSent / item.totalRecipients) * 100).toFixed(1);
                    const date = new Date(item.timestamp).toLocaleString('ko-KR');

                    return `
                        <div class="history-item">
                            <div class="history-header">
                                <div class="history-date">${date}</div>
                                <span class="badge badge-success">${successRate}% 성공</span>
                            </div>
                            <div class="history-message">${item.message}</div>
                            <div class="history-stats">
                                <span>총 ${item.totalRecipients}명</span>
                                <span>✅ ${item.totalSent}건 성공</span>
                                ${item.totalFailed > 0 ? `<span>❌ ${item.totalFailed}건 실패</span>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                document.getElementById('historyList').innerHTML =
                    '<p class="empty-state">발송 이력을 불러오는데 실패했습니다.</p>';
            }
        }

        // 초기화
        checkServerStatus();
        loadContacts();
    </script>
</body>
</html>
